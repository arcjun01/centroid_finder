name: JUnit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'

      # Build the Maven project in your processor directory
      - name: Build with Maven
        run: mvn -B clean package --file processor/pom.xml

      # Run JUnit tests using Maven's built-in test runner
      - name: Run Tests with Maven
        run: mvn -B test --file processor/pom.xml

      # (Optional) Verify number of tests run
      - name: Verify test count
        run: |
          TEST_COUNT=$(grep -oP '\d+(?= tests run)' processor/target/surefire-reports/*.txt | head -n 1)
          MIN_TESTS=15
          if [ -z "$TEST_COUNT" ]; then
            echo "No tests were found in reports. Make sure you have JUnit tests in src/test/java"
            exit 1
          fi
          if [ "$TEST_COUNT" -lt "$MIN_TESTS" ]; then
            echo "Only $TEST_COUNT tests were run. At least $MIN_TESTS tests are required."
            exit 1
          fi
          echo "All JUnit tests passed. $TEST_COUNT tests executed successfully."
